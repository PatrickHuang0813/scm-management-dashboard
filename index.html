<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SCM issue tracking dashboard" />
    <title>SCM Control Room</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">OPERATIONS / ISSUE TRACKING</p>
          <h1>SCM Control Room</h1>
          <p class="subhead" data-i18n="subtitle">供應鏈客戶問題與處理經驗追蹤</p>
        </div>
        <div class="header-actions">
          <label class="language-select" for="languageSelect"><span data-i18n="language">語言</span><select id="languageSelect" aria-label="語言" data-i18n-aria="language"><option value="zh-Hant">中文</option><option value="en">English</option></select></label>
          <button class="button button-quiet" id="downloadTemplateButton" type="button" data-i18n="downloadTemplate">下載 Excel 範本</button>
          <label class="button button-primary" for="fileInput" data-i18n="importExcel">匯入 Excel</label>
          <input id="fileInput" type="file" accept=".xlsx,.xls,.csv" hidden />
          <button class="button button-dark" id="exportButton" type="button" data-i18n="exportData">匯出資料</button>
        </div>
      </header>

      <section class="notice" id="notice" aria-live="polite" hidden></section>

      <section class="metrics" aria-label="資料摘要" data-i18n-aria="issueSummary">
        <article class="metric-card metric-stock">
          <span data-i18n="totalIssues">追蹤案件</span>
          <strong id="itemCount">0</strong>
          <small data-i18n="currentDataset">目前資料集</small>
        </article>
        <article class="metric-card metric-value">
          <span data-i18n="customerCount">客戶數</span>
          <strong id="customerCount">0</strong>
          <small data-i18n="customersTracked">已追蹤客戶</small>
        </article>
        <article class="metric-card metric-risk">
          <span data-i18n="moduleCount">模組數</span>
          <strong id="moduleCount">0</strong>
          <small data-i18n="activeModules">涉及產品模組</small>
        </article>
        <article class="metric-card metric-supplier">
          <span data-i18n="scmOwnerCount">SCM 負責人</span>
          <strong id="scmOwnerCount">0</strong>
          <small data-i18n="activeOwners">處理責任歸屬</small>
        </article>
      </section>

      <section class="workspace">
        <aside class="panel filters-panel">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">FILTERS</p>
              <h2 data-i18n="filters">資料篩選</h2>
            </div>
            <button class="text-button" id="clearFiltersButton" type="button" data-i18n="clear">清除</button>
          </div>
          <label><span data-i18n="keyword">關鍵字</span><input id="searchInput" type="search" placeholder="客戶、問題描述、負責人" data-i18n-placeholder="searchPlaceholder" /></label>
          <label><span data-i18n="customer">客戶</span><select id="customerFilter"><option value="" data-i18n="allCustomers">全部客戶</option></select></label>
          <label><span data-i18n="module">模組</span><select id="moduleFilter"><option value="" data-i18n="allModules">全部模組</option></select></label>
          <label><span data-i18n="scmOwner">SCM 負責人</span><select id="scmOwnerFilter"><option value="" data-i18n="allScmOwners">全部 SCM 負責人</option></select></label>
          <div class="filter-note"><span></span><span data-i18n="issueNote">資料來自 SCM 追蹤工作表</span></div>
        </aside>

        <section class="panel data-panel">
          <div class="panel-heading table-heading">
            <div>
              <p class="eyebrow">ISSUE LOG</p>
              <h2 data-i18n="issueList">案件清單</h2>
            </div>
            <button class="button button-quiet" id="addRecordButton" type="button" data-i18n="addIssue">新增案件</button>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th data-i18n="customer">客戶</th><th data-i18n="date">日期</th><th data-i18n="description">問題描述</th><th data-i18n="module">模組</th><th data-i18n="scmOwner">SCM 負責人</th><th data-i18n="rdOwner">RD 負責人</th><th data-i18n="handling">SCM 處理方式</th><th data-i18n="lessonLearned">經驗學習</th><th aria-label="操作" data-i18n-aria="actions"></th></tr></thead>
              <tbody id="inventoryTableBody"></tbody>
            </table>
          </div>
          <div class="empty-state" id="emptyState" hidden data-i18n="emptyState">尚無符合條件的資料。請匯入 Excel 或新增案件。</div>
        </section>
      </section>
    </main>

    <dialog id="recordDialog">
      <form id="recordForm" method="dialog">
        <div class="dialog-heading"><div><p class="eyebrow">ISSUE RECORD</p><h2 id="dialogTitle">新增案件</h2></div><button class="icon-button" type="button" id="closeDialogButton" aria-label="關閉" data-i18n-aria="close">x</button></div>
        <div class="form-grid">
          <label><span data-i18n="customer">客戶</span><input name="Cutomer" required /></label><label><span data-i18n="date">日期</span><input name="Date" type="date" required /></label>
          <label><span data-i18n="description">問題描述</span><input name="Description" required /></label><label><span data-i18n="module">模組</span><input name="Module" required /></label>
          <label><span data-i18n="scmOwner">SCM 負責人</span><input name="SCM Owner" required /></label><label><span data-i18n="rdOwner">RD 負責人</span><input name="RD Owner" required /></label>
          <label><span data-i18n="handling">SCM 處理方式</span><input name="How to Handle by SCM Team" required /></label><label><span data-i18n="lessonLearned">經驗學習</span><input name="Lesson Learn" required /></label>
        </div>
        <div class="dialog-actions"><button class="button button-quiet" type="button" id="cancelDialogButton" data-i18n="cancel">取消</button><button class="button button-primary" type="submit" data-i18n="save">儲存資料</button></div>
      </form>
    </dialog>
    <script src="app.js"></script>
  </body>
</html>
